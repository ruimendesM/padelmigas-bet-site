                  - slug
                  - name
                  - startsAt
                  - status
                  - groupCount
                  - ballotCount
                  - groups
                additionalProperties: false
        "400":
          description: "`UNRESOLVED_PLAYERS` | `MALFORMED_PAYLOAD` | `START_NOT_IN_FUTURE` |
            `DUPLICATE_PLAYER` | `POINTS_MISMATCH` | `INVALID_GROUP_SIZE` | `NOT_CONFIRMED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorWithIssues"
        "401":
          description: "`UNAUTHORISED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorWithIssues"
        "409":
          description: "`SLUG_TAKEN`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorWithIssues"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 3
                slug:
                  type: string
                  minLength: 1
                  maxLength: 120
                  pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
                startsAt:
                  type: string
                  format: date-time
                pairs:
                  type: array
                  items:
                    type: object
                    properties:
                      club:
                        type: string
                        minLength: 1
                      totalPoints:
                        type: integer
                        minimum: 0
                      group:
                        type: string
                        minLength: 1
                      players:
                        type: array
                        minItems: 2
                        maxItems: 2
                        items:
                          - type: object
                            properties:
                              name:
                                type: string
                                minLength: 1
                              points:
                                type: integer
                                minimum: 0
                              externalId:
                                type: integer
                                exclusiveMinimum: true
                                minimum: 0
                            required:
                              - name
                              - points
                            additionalProperties: false
                          - type: object
                            properties:
                              name:
                                type: string
                                minLength: 1
                              points:
                                type: integer
                                minimum: 0
                              externalId:
                                type: integer
                                exclusiveMinimum: true
                                minimum: 0
                            required:
                              - name
                              - points
                            additionalProperties: false
                    required:
                      - club
                      - totalPoints
                      - players
                    additionalProperties: false
                  minItems: 3
                confirm:
                  type: boolean
                  enum:
                    - true
              required:
                - name
                - startsAt
                - pairs
                - confirm
              additionalProperties: false
      security:
        - organiserSession: []
  /admin/rankings/sync:
    post:
      operationId: syncRankings
      tags:
        - admin
      summary: Import the public ranking sheet into players and rating snapshots
      description: "Requirements: FR-004, FR-007."
      responses:
        "200":
          description: Import the public ranking sheet into players and rating snapshots
          content:
            application/json:
              schema:
                type: object
                properties:
                  rowsRead:
                    type: integer
                    minimum: 0
                  playersCreated:
                    type: integer
                    minimum: 0
                  playersUpdated:
                    type: integer
                    minimum: 0
                  snapshotsWritten:
                    type: integer
                    minimum: 0
                  sourceFetchedAt:
                    type: string
                    format: date-time
                  stale:
                    type: boolean
                required:
                  - rowsRead
                  - playersCreated
                  - playersUpdated
                  - snapshotsWritten
                  - sourceFetchedAt
                  - stale
                additionalProperties: false
        "401":
          description: "`UNAUTHORISED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorWithIssues"
        "409":
          description: "`DUPLICATE_MATCH_KEY`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorWithIssues"
      security:
        - organiserSession: []
        - cronSecret: []
components:
  securitySchemes:
    organiserSession:
      type: apiKey
      in: cookie
      name: pm_admin
      description: Server-signed organiser session cookie; the anonymous public never holds one.
    cronSecret:
      type: http
      scheme: bearer
      description: Shared secret held only by the scheduler, accepted by the rankings-sync route alone so
        the cron job can run without an organiser session. Never accepted elsewhere.
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          enum:
            - NOT_FOUND
            - UNAUTHORISED
            - RATE_LIMITED
            - MALFORMED_PAYLOAD
            - INTERNAL_ERROR
            - UNRESOLVED_PLAYERS
            - START_NOT_IN_FUTURE
            - DUPLICATE_PLAYER
            - POINTS_MISMATCH
            - INVALID_GROUP_SIZE
            - SLUG_TAKEN
            - NOT_CONFIRMED
            - DUPLICATE_MATCH_KEY
            - INCOMPLETE_BALLOT
            - DUPLICATE_POSITION
            - UNKNOWN_PAIR
            - MISSING_PAIR
            - ALREADY_VOTED
            - VOTING_CLOSED
            - RESULTS_HIDDEN
        message:
          type: string
      required:
        - code
        - message
      additionalProperties: false
    ErrorWithIssues:
      type: object
      properties:
        code:
          type: string
          enum:
            - NOT_FOUND
            - UNAUTHORISED
            - RATE_LIMITED
            - MALFORMED_PAYLOAD
            - INTERNAL_ERROR
            - UNRESOLVED_PLAYERS
            - START_NOT_IN_FUTURE
            - DUPLICATE_PLAYER
            - POINTS_MISMATCH
            - INVALID_GROUP_SIZE
            - SLUG_TAKEN
            - NOT_CONFIRMED
            - DUPLICATE_MATCH_KEY
            - INCOMPLETE_BALLOT
            - DUPLICATE_POSITION
            - UNKNOWN_PAIR
            - MISSING_PAIR
            - ALREADY_VOTED
            - VOTING_CLOSED
            - RESULTS_HIDDEN
        message:
          type: string
        issues:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
            required:
              - path
              - message
            additionalProperties: false
          default: []
      required:
        - code
        - message
      additionalProperties: false
