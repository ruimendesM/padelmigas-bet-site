# vhost for padelmigas.ruimendesdev.eu (ADR-010 § Amendment).
#
# Installed as /etc/nginx/sites-available/padelmigas.ruimendesdev.eu with a symlink from
# sites-enabled/, matching the two services already on this host. The TLS lines below are the shape
# Certbot writes; see docs/deploy/vps.md for issuing the certificate first and enabling the site
# after, since nginx will not start referencing a certificate that does not yet exist.

server {
    server_name padelmigas.ruimendesdev.eu;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # DELIBERATELY NOT THE IDIOM USED BY THE OTHER VHOSTS ON THIS HOST, AND NOT A MISTAKE.
        #
        # This one REPLACES the header with the peer address instead of appending to whatever the
        # caller sent. `clientAddress()` in apps/web/src/server/rate-limit.ts keys the ballot rate
        # limit on the FIRST hop of this header. With the appending form the caller writes that
        # first hop themselves, so anyone could rotate their own rate-limit key on every request and
        # vote without limit (Risk R2).
        #
        # tests/architecture/nginx-forwarded-for.test.ts fails if this line is changed back.
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/padelmigas.ruimendesdev.eu/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/padelmigas.ruimendesdev.eu/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = padelmigas.ruimendesdev.eu) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name padelmigas.ruimendesdev.eu;
    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot
}
